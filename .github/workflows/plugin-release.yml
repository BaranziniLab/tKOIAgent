name: Plugin validation and release

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v2.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Validate plugin and exercise its graph tools
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build the distributable and validate versions
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            python scripts/build_release.py --tag "$GITHUB_REF_NAME"
          else
            python scripts/build_release.py
          fi

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # This repository is a plugin, so override the default deps::. package.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            github::BaranziniLab/tkoi@v1.3.0
            any::jsonlite
            any::sessioninfo
          dependencies: '"hard"'
          install-pandoc: false
          install-quarto: false

      - name: Check the installed tKOI version
        shell: Rscript {0}
        run: |
          stopifnot(packageVersion("tkoi") >= package_version("1.3.0"))
          stopifnot(is.function(tkoi::get_analysis_graph))

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            skills/tkoi-knowledge-graph/scripts/server.py

      - name: Extract the release for runtime testing
        shell: python
        run: |
          import os
          from pathlib import Path
          import shutil
          import zipfile

          archives = list(Path("dist").glob("*.zip"))
          assert len(archives) == 1
          destination = Path(os.environ["RUNNER_TEMP"]) / "tkoi-plugin"
          with zipfile.ZipFile(archives[0]) as archive:
              archive.extractall(destination)
          roots = list(destination.iterdir())
          assert len(roots) == 1 and roots[0].is_dir()
          shutil.copytree("tests", roots[0] / "tests")
          with Path(os.environ["GITHUB_ENV"]).open("a") as environment:
              environment.write(f"PLUGIN_TEST_ROOT={roots[0]}\n")

      - name: Create a real saved analysis fixture
        working-directory: ${{ env.PLUGIN_TEST_ROOT }}
        run: Rscript tests/create_fixture.R /tmp/tkoi-fixture

      - name: Exercise the MCP server and preprocessing
        working-directory: ${{ env.PLUGIN_TEST_ROOT }}
        run: uv run --with 'mcp>=1.12,<2' python tests/smoke_mcp.py /tmp/tkoi-fixture

      - name: Verify the distribution checksum
        working-directory: dist
        run: sha256sum --check *.sha256

      - name: Upload the tested plugin distribution
        uses: actions/upload-artifact@v4
        with:
          name: tkoi-agent-plugin
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish the tested plugin
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v2.')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tkoi-agent-plugin
          path: dist

      - name: Verify the downloaded distribution
        working-directory: dist
        run: sha256sum --check *.sha256

      - name: Create or update the GitHub release
        shell: bash
        run: |
          shopt -s nullglob
          assets=(dist/*.zip dist/*.sha256)
          [[ ${#assets[@]} -eq 2 ]]
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            options=(--verify-tag --title "tKOI Agent $RELEASE_TAG" --generate-notes)
            if [[ "$RELEASE_TAG" == *-* ]]; then
              options+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${options[@]}" "${assets[@]}"
          fi
