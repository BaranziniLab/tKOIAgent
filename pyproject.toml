requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Wanjun Gu" }
]
keywords = [
    "bioinformatics",
    "rnaseq",
    "knowledge-graph",
    "mcp",
    "spoke",
    "transcriptomics"
]
dependencies = [
    "fastmcp>=0.1.0",
    "neo4j>=5.0.0,<6.0.0",
    "pydantic>=2.0.0,<3.0.0",
]